name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only build+test, never write repo. read-only token so compromised step cant push or alter releases
permissions:
  contents: read

# JS actions on Node.js 24 (Node.js 20 deprecated)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: Build & test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # no checkout token left in .git/config for later steps
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore Curfew.sln

      - name: Build solution (Core, Service)
        run: dotnet build Curfew.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test Curfew.sln -c Release --no-build --verbosity normal

      # WinUI app needs x64, built on its own so AnyCPU solution build stays clean
      - name: Build WinUI app (x64)
        run: dotnet build src/Curfew.App/Curfew.App.csproj -c Release -p:Platform=x64

  installer-script:
    name: Compile installer script
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # compile setup.iss against stub payload folders. validates Inno Setup directives + [Code] Pascal every push, so script error surfaces here not on tagged release
      - name: Compile setup.iss with stub payload
        shell: pwsh
        run: |
          foreach ($d in 'service','app','overlay','cli') {
            New-Item -ItemType Directory -Path "installer\$d" -Force | Out-Null
            Set-Content -Path "installer\$d\stub.txt" -Value 'ci stub'
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.1 "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
